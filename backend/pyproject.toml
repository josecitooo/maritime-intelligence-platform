[project]
name = "maritime-intelligence-platform"
version = "0.1.0"
description = "Maritime Intelligence Platform — AIS ingestion, analysis and 3D visualization"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.1.0",
    "psycopg[binary]>=3.2",
    "geoalchemy2>=0.20",
    "alembic>=1.14",
    "websockets>=14,<18",
    "httpx>=0.28",
    "pyarrow>=15",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6",
    "ruff>=0.9",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning:app.*"]
markers = [
    "integration: needs the test database (docker compose -f docker-compose.test.yml up -d --wait)",
]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
