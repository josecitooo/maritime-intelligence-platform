name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
    contents: read

jobs:
  backend:
    name: backend lint + tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: maritime_test
          POSTGRES_PASSWORD: maritime_test
          POSTGRES_DB: maritime_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U maritime_test -d maritime_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      ENVIRONMENT: test
      LOG_FORMAT: json
      DATABASE_URL: postgresql+psycopg://maritime_test:maritime_test@localhost:5432/maritime_test

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      # The migration is the artifact that says how the schema is built, so
      # the database has to be at head before `check` can compare models
      # against it — the same order documented in README.md.
      - name: Migrations
        run: |
          alembic upgrade head
          alembic check

      - name: Tests
        run: pytest

  frontend:
    name: frontend build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      # `npm run build` is `tsc --noEmit && vite build`: the typecheck gate
      # and the production bundle in one command, as documented in README.md.
      - name: Build
        run: npm run build
